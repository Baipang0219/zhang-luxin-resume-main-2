<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>张路欣 — 个人简历与作品展示</title>
  <meta name="description" content="张路欣 的个人网页 — 简历与作品展示" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="container hero-inner">
      <div class="intro">
        <h1 class="name" id="profile-name"></h1>
        <p class="role" id="profile-role"></p>
        <div class="contact-chips" id="profile-contact"></div>
        <div class="hero-ctas">
          <a class="btn primary" href="#works">作品集</a>
          <a class="btn" href="#resume">下载简历</a>
        </div>
      </div>
      <div class="profile-card" aria-hidden="false">
        <!-- 占位头像：替换为你的照片 -->
        <div class="avatar-placeholder" id="profile-avatar">照片</div>
        <div class="quick-stats" id="profile-stats"></div>
      </div>
    </div>
    <svg class="hero-wave" viewBox="0 0 1440 120"><path fill="rgba(255,255,255,0.06)" d="M0,80 C360,20 1080,140 1440,80 L1440,200 L0,200 Z"></path></svg>
  </header>

  <main>
    <section id="resume" class="container section card">
      <h2 class="section-title">个人简历</h2>
      <div class="grid" id="resume-content"></div>
    </section>

    <section id="works" class="container section">
      <h2 class="section-title">作品集 / 项目</h2>
      <p class="muted">以下为示例展示，点击可查看大图或播放（替换为你的视频/链接）。</p>
      <div class="masonry" id="works-list"></div>
    </section>

    <section id="activities" class="container section card">
      <h2 class="section-title">校园经历与组织</h2>
      <ul id="activities-list"></ul>
    </section>

    <section id="contact" class="container section">
      <h2 class="section-title">联系我</h2>
      <div class="contact-grid card">
        <div>
          <h3>联系方式</h3>
          <p id="contact-details"></p>
          <p id="contact-address"></p>
        </div>
        <div>
          <h3>快速动作</h3>
          <p><a class="btn" href="mailto:1010631266@qq.com">发邮件</a> <a class="btn" href="#works">查看作品</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p id="footer-copy"></p>
      <p class="muted">内容由 resume-data.json 驱动，可直接更新数据文件。</p>
    </div>
  </footer>

  <div id="lightbox" class="lightbox" style="display:none">
    <div class="lightbox-inner">
      <button id="lb-close" class="lb-close">✕</button>
      <div id="lb-content"></div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
